name: Daily competitor intel update

on:
  # 本机 LaunchAgent 是唯一的定时写入者，避免与云端同时修改 index.html。
  # 保留手动入口，便于必要时从 GitHub Actions 发起一次补抓。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Refresh candidate intel
        run: python auto_update_intel.py --dashboard index.html

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No dashboard changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update daily competitor intel"
          git push
